<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f2">
    <title>おこづかい帳</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">MY LITTLE WALLET</p>
                <h1 id="app-title">おこづかい帳</h1>
            </div>
            <span class="header-icon" aria-hidden="true">✳</span>
        </header>

        <section class="family-section" aria-labelledby="family-title">
            <div class="section-heading">
                <h2 id="family-title">だれのおこづかい？</h2>
            </div>
            <nav id="profile-list" class="profile-list" aria-label="家族の切り替え"></nav>
            <form id="profile-form" class="profile-form">
                <label class="profile-name-field">
                    <span id="profile-form-label">家族の名前</span>
                    <input id="profile-name" name="name" type="text" maxlength="24" placeholder="例：はな" autocomplete="off" required>
                </label>
                <button class="add-profile-button" type="submit"><span aria-hidden="true">＋</span> <span id="profile-submit-label">追加</span></button>
            </form>
            <p id="profile-message" class="profile-message" role="status" aria-live="polite"></p>
        </section>

        <section id="chore-section" class="chore-section" aria-labelledby="chore-title" hidden>
            <div class="section-heading">
                <h2 id="chore-title">お手伝いチェック表</h2>
            </div>
            <form id="chore-form" class="chore-form">
                <label class="field">
                    <span>だれがお手伝いした？</span>
                    <select id="chore-person" name="person" required></select>
                </label>
                <label class="field">
                    <span>チェック表に追加するお手伝い</span>
                    <input id="chore-task" name="task" type="text" maxlength="60" placeholder="例：お皿洗い" required>
                </label>
                <label class="field">
                    <span>日付</span>
                    <input id="chore-date" name="date" type="date" required>
                </label>
                <button class="submit-button chore-submit" type="submit">お手伝いを追加 <span aria-hidden="true">＋</span></button>
                <p id="chore-message" class="form-message" role="status" aria-live="polite"></p>
            </form>
            <div class="chore-week">
                <div class="chore-week-heading">
                    <h3 id="chore-week-label">今週のチェック表</h3>
                    <div class="week-controls" aria-label="週の切り替え">
                        <button id="previous-week" class="week-button" type="button" aria-label="前の週">‹</button>
                        <button id="current-week" class="week-button week-today-button" type="button">今週</button>
                        <button id="next-week" class="week-button" type="button" aria-label="次の週">›</button>
                    </div>
                </div>
                <p class="week-hint">選んだ人：<strong id="chore-checker-name"></strong>。日付のマスを押すとチェックできます。</p>
                <div class="chore-table-scroll" role="region" aria-label="月曜日から日曜日のお手伝いチェック表" tabindex="0">
                    <table class="chore-table">
                        <thead>
                            <tr id="chore-week-header"></tr>
                        </thead>
                        <tbody id="chore-week-body"></tbody>
                    </table>
                </div>
                <p id="chore-week-empty" class="week-empty" hidden>お手伝いを登録すると、ここにチェック表ができます。</p>
            </div>
        </section>

        <section id="balance-section" class="balance-card" aria-labelledby="balance-title" hidden>
            <p id="balance-title" class="card-label">いまの残高</p>
            <p class="balance-amount"><span id="balance">¥0</span></p>
            <div class="summary">
                <div>
                    <span class="summary-icon income-icon" aria-hidden="true">↙</span>
                    <span class="summary-label">今月の収入</span>
                    <strong id="monthly-income">¥0</strong>
                </div>
                <div>
                    <span class="summary-icon expense-icon" aria-hidden="true">↗</span>
                    <span class="summary-label">今月の支出</span>
                    <strong id="monthly-expense">¥0</strong>
                </div>
            </div>
        </section>

        <section id="entry-section" class="form-section" aria-labelledby="form-title" hidden>
            <h2 id="form-title">記録をつける</h2>
            <form id="transaction-form">
                <div class="type-switch" role="group" aria-label="記録の種類">
                    <button class="type-button is-selected" type="button" data-type="expense" aria-pressed="true">支出</button>
                    <button class="type-button" type="button" data-type="income" aria-pressed="false">収入</button>
                </div>
                <input id="type" name="type" type="hidden" value="expense">

                <div class="form-grid">
                    <label class="field field-amount">
                        <span>金額</span>
                        <div class="amount-input">
                            <span aria-hidden="true">¥</span>
                            <input id="amount" name="amount" type="number" min="1" step="1" placeholder="500" required inputmode="numeric">
                        </div>
                    </label>
                    <label class="field">
                        <span>カテゴリ</span>
                        <select id="category" name="category">
                            <option value="おこづかい">おこづかい</option>
                            <option value="食べもの">食べもの</option>
                            <option value="あそび">あそび</option>
                            <option value="おやつ">おやつ</option>
                            <option value="本・学び">本・学び</option>
                            <option value="その他">その他</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>日付</span>
                        <input id="date" name="date" type="date" required>
                    </label>
                    <label class="field">
                        <span>メモ <small>（任意）</small></span>
                        <input id="memo" name="memo" type="text" maxlength="60" placeholder="何に使った？">
                    </label>
                </div>
                <button class="submit-button" type="submit">記録する <span aria-hidden="true">＋</span></button>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section id="history-section" class="history-section" aria-labelledby="history-title" hidden>
            <div class="section-heading">
                <h2 id="history-title">最近の記録</h2>
                <span id="record-count" class="record-count">0件</span>
            </div>
            <ul id="transaction-list" class="transaction-list" aria-live="polite"></ul>
            <p id="empty-state" class="empty-state">まだ記録がありません。<br>最初の記録をつけてみよう！</p>
        </section>

        <footer>記録はこの端末のブラウザーに保存されます</footer>
    </main>


</body>
</html>
